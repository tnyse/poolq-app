<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PoolQ is the invite-only NFL picks pool. Make weekly picks, climb the leaderboard, and compete with your crew all season.">
  <meta name="theme-color" content="#063a73">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://poolq.app/">
  <meta property="og:site_name" content="PoolQ">
  <meta property="og:title" content="PoolQ — NFL Picks Pool">
  <meta property="og:description" content="PoolQ is the invite-only NFL picks pool. Make weekly picks, climb the leaderboard, and compete with your crew all season.">
  <meta property="og:image" content="https://poolq.app/og-image.png">
  <meta property="og:image:secure_url" content="https://poolq.app/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="PoolQ — NFL picks pool">
  <!-- Square image preferred by some Facebook placements -->
  <meta property="og:image" content="https://poolq.app/facebook-share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1200">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://poolq.app/">
  <meta name="twitter:title" content="PoolQ — NFL Picks Pool">
  <meta name="twitter:description" content="PoolQ is the invite-only NFL picks pool. Make weekly picks, climb the leaderboard, and compete with your crew all season.">
  <meta name="twitter:image" content="https://poolq.app/og-image.png">
  <meta name="twitter:image:alt" content="PoolQ — NFL picks pool">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PoolQ">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="shortcut icon" href="favicon.ico">

  <title>PoolQ — NFL Picks Pool</title>
  <link rel="manifest" href="manifest.json">
  <script src="pwa_install.js" defer></script>
  <!-- Quietly drop any leftover service workers. Do NOT reload — a forced
       reload on mobile Chrome while CanvasKit is compiling can Aw-Snap. -->
  <script>
    (function () {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            (regs || []).forEach(function (r) { r.unregister(); });
          });
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            (keys || []).forEach(function (k) { caches.delete(k); });
          });
        }
      } catch (e) {}
    })();
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #063a73; }
    #pq-boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; color: #fff; font-family: system-ui, sans-serif;
      font-size: 16px; font-weight: 600; letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div id="pq-boot">Loading PoolQ…</div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
